server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never let browsers keep a stale copy of the shell page: it references
    # content-hashed assets, so it must be revalidated on every visit.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API + metrics proxied to the backend (single origin, no CORS needed)
    location ~ ^/(health|ready|alarms|sites|sensors|snapshot|metrics|correlations|stats|browse) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # Dashboard WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}